# The landing page lives in RikaiDev.github.io. Its volatile release metadata is
# loaded from GitHub/npm at runtime, so publishing Yomi no longer needs a second
# repository write or a long-lived cross-repository token. This job audits that
# the deployed page still has the live updater and latest-release downloads.
name: site-live-audit

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live release integration
        run: |
          page="$(curl --fail --silent --show-error --location --retry 4 \
            https://rikaidev.github.io/yomi/)"
          updater="$(curl --fail --silent --show-error --location --retry 4 \
            https://rikaidev.github.io/assets/yomi-release.js)"

          grep -Fq '/assets/yomi-release.js' <<<"$page"
          grep -Fq 'data-yomi-version' <<<"$page"
          grep -Fq 'releases/latest/download/yomi-win32-x64.mcpb' <<<"$page"
          grep -Fq 'api.github.com/repos/RikaiDev/yomi/releases/latest' <<<"$updater"
          grep -Fq 'registry.npmjs.org/@rikaidev%2Fyomi/latest' <<<"$updater"
